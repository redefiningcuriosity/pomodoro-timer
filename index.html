<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Pomodoro</title>
    <!-- Google Fonts: 'Outfit' for a clean, modern look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <div class="container">
        <header>
            <h1>Focus Timer</h1>
        </header>

        <main class="timer-card">
            <div class="timer-display" id="time-display">25:00</div>

            <div class="settings-container">
                <label for="custom-time">Set Minutes:</label>
                <input type="number" id="custom-time" value="25" min="1" max="99">
            </div>

            <div class="controls">
                <button id="start-btn" class="btn btn-primary">Start</button>
                <button id="reset-btn" class="btn btn-secondary">Reset</button>
            </div>
        </main>

        <footer>
            <p>Stay focused. Take breaks.</p>
        </footer>
    </div>
</body>

</html>
